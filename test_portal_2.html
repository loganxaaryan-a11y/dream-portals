<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream Portals — Unified Player</title>
  <style>
    :root {
      --bg: #000000;
      --card: #0a0a0f;
      --border: #1a1b26;
      --accent: #7aa2f7;
      --accent-green: #73daca;
      --text: #a9b1d6;
      --muted: #565f89;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .header h1 {
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--text);
      margin-bottom: 6px;
    }
    .header p {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .toggles {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .pill {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pill.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(122, 162, 247, 0.08);
    }
    .portal-grid {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .portal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .portal-card:hover {
      border-color: #2f334d;
    }
    .portal-card.playing {
      border-color: var(--accent);
      box-shadow: 0 0 25px rgba(122, 162, 247, 0.08);
    }
    .portal-card.rainforest.playing {
      border-color: var(--accent-green);
      box-shadow: 0 0 25px rgba(115, 218, 202, 0.08);
    }
    .portal-info h2 {
      font-size: 1.05rem;
      font-weight: 500;
      color: #c0caf5;
      margin-bottom: 4px;
    }
    .portal-info span {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border);
      transition: all 0.3s ease;
    }
    .portal-card.playing .status-dot {
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    .portal-card.rainforest.playing .status-dot {
      background: var(--accent-green);
      box-shadow: 0 0 12px var(--accent-green);
    }
    .portal-card.sailboat.playing {
      border-color: #7dcfff;
      box-shadow: 0 0 25px rgba(125, 207, 255, 0.08);
    }
    .portal-card.sailboat.playing .status-dot {
      background: #7dcfff;
      box-shadow: 0 0 12px #7dcfff;
    }
    #stage-readout {
      margin-top: 28px;
      font-size: 0.8rem;
      color: var(--muted);
      height: 20px;
      letter-spacing: 0.04em;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>DREAM PORTALS</h1>
    <p>Tap a destination and close your eyes</p>
  </div>

  <!-- Optional Pre-Flight Add-On Toggles -->
  <div class="toggles">
    <button class="pill" id="pill-unwind" onclick="this.classList.toggle('active')">+ 3m Body Unwind</button>
    <button class="pill" id="pill-shuffle" onclick="this.classList.toggle('active')">+ 5m Mind Shuffle</button>
  </div>

  <!-- Unified Portal Roster (1-10) -->
  <div class="portal-grid">
    <div class="portal-card" id="moon-bus-card" onclick="togglePortal('moon_bus')">
      <div class="portal-info">
        <h2>🚌 Bus to the Moon</h2>
        <span>Sub-bass cabin hum • Theta wave drift</span>
      </div>
      <div class="status-dot"></div>
    </div>

    <div class="portal-card rainforest" id="rainforest-card" onclick="togglePortal('rainforest')">
      <div class="portal-info">
        <h2>🚂 Train to the Rainforest</h2>
        <span>Warm rain on roof • Organic rail rhythm</span>
      </div>
      <div class="status-dot"></div>
    </div>

    <div class="portal-card sailboat" id="sailboat-card" onclick="togglePortal('sailboat')">
      <div class="portal-info">
        <h2>⛵ Sailboat on a Quiet Bay</h2>
        <span>Water lap • Hull creak • Night wind</span>
      </div>
      <div class="status-dot"></div>
    </div>
  </div>

  <div id="stage-readout">Ready for departure</div>

  <script>
    let audioCtx = null;
    let masterGain = null;
    let rainFilterNode = null;
    let sharedNoiseBuffer = null;
    let isPlaying = false;
    let activePortal = null;
    let sessionToken = 0; // Prevents overlapping voices when switching portals
    let currentVoiceSource = null;
    let timerId = null;
    let clackTimeoutId = null;
    let sfxTimeouts = [];
    let rainGainNode = null;
    let insectMasterGain = null;
    let insectTimeoutId = null;
    let leafTimeoutId = null;
    let frogTimeoutId = null;
    let atmosphereLevel = 1.0;
    let moonPingTimeoutId = null;
    let moonPingEnabled = true;
    let moonAirGainNode = null;
    let sailboatWaterGainNode = null;
    let sailboatWindGainNode = null;
    let sailboatCabinGainNode = null;
    let sailboatCreakTimeoutId = null;

    // Subtle Described-Action Sound Cue Map for Rainforest Train
    const RAINFOREST_SFX_CUES = {
      departure_1: [{ type: 'door_slide', delay: 3.8, gain: 0.11 }],
      departure_2: [{ type: 'wood_creak', delay: 11.0, gain: 0.08 }],
      departure_3: [{ type: 'canopy_swell', delay: 12.0, gain: 0.09 }],
      drift_01: [{ type: 'tree_wind', delay: 1.5, gain: 0.07 }],
      drift_05: [{ type: 'tree_wind', delay: 1.8, gain: 0.06 }],
      drift_06: [{ type: 'canopy_swell', delay: 1.0, gain: 0.08 }],
      drift_08: [{ type: 'tree_wind', delay: 1.5, gain: 0.06 }],
      drift_10: [{ type: 'wood_creak', delay: 1.2, gain: 0.08 }],
      drift_11: [{ type: 'bridge_hollow', delay: 1.5, gain: 0.09 }],
      drift_14: [{ type: 'tree_wind', delay: 1.5, gain: 0.06 }],
      drift_16: [{ type: 'tree_wind', delay: 2.0, gain: 0.06 }],
      drift_18: [{ type: 'tree_wind', delay: 1.5, gain: 0.07 }],
      drift_20: [{ type: 'bridge_hollow', delay: 1.5, gain: 0.07 }],
      drift_23: [{ type: 'tree_wind', delay: 1.2, gain: 0.07 }],
      drift_25: [{ type: 'canopy_swell', delay: 1.2, gain: 0.07 }],
      drift_29: [{ type: 'tree_wind', delay: 1.5, gain: 0.06 }]
    };

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function randomBetween(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function createPinkNoiseBuffer(seconds = 18) {
      const bufferSize = audioCtx.sampleRate * seconds;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.03;
        b6 = white * 0.115926;
      }
      return buffer;
    }

    // Plays ultra-soft, underneath described-action cues
    function triggerSubtleCue(type, peakGain = 0.08, token) {
      if (!isPlaying || token !== sessionToken || !audioCtx || !masterGain) return;
      const now = audioCtx.currentTime;

      if (type === 'door_slide') {
        // Soft pressurized glass door slide + gentle low latch thud
        const src = audioCtx.createBufferSource();
        src.buffer = sharedNoiseBuffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(380, now);
        filter.frequency.exponentialRampToValueAtTime(160, now + 1.5);
        filter.Q.value = 2.5;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(peakGain, now + 0.4);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.6);

        src.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        src.start(now);
        src.stop(now + 1.7);

        // Soft muffled latch thud at 1.45s
        const latchOsc = audioCtx.createOscillator();
        const latchGain = audioCtx.createGain();
        latchOsc.type = 'sine';
        latchOsc.frequency.setValueAtTime(68, now + 1.45);
        latchOsc.frequency.exponentialRampToValueAtTime(34, now + 1.65);
        latchGain.gain.setValueAtTime(0.001, now + 1.45);
        latchGain.gain.linearRampToValueAtTime(peakGain * 1.1, now + 1.48);
        latchGain.gain.exponentialRampToValueAtTime(0.001, now + 1.72);
        latchOsc.connect(latchGain);
        latchGain.connect(masterGain);
        latchOsc.start(now + 1.45);
        latchOsc.stop(now + 1.75);

      } else if (type === 'tree_wind') {
        // Soft breeze through wet jungle leaves (5.0s)
        const src = audioCtx.createBufferSource();
        src.buffer = sharedNoiseBuffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(220, now);
        filter.frequency.linearRampToValueAtTime(340, now + 2.2);
        filter.frequency.linearRampToValueAtTime(190, now + 5.0);
        filter.Q.value = 1.8;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(peakGain, now + 1.8);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 5.0);

        src.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        src.start(now);
        src.stop(now + 5.1);

      } else if (type === 'wood_creak') {
        // Warm wooden sleeper-car sway (2.4s)
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(135, now);
        osc.frequency.linearRampToValueAtTime(98, now + 1.2);
        osc.frequency.linearRampToValueAtTime(118, now + 2.4);

        filter.type = 'lowpass';
        filter.frequency.value = 260;

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(peakGain * 0.5, now + 0.8);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.4);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now + 2.5);

      } else if (type === 'canopy_swell' && rainFilterNode) {
        // Gentle swell of rain warmth on the glass roof (4.5s)
        rainFilterNode.frequency.cancelScheduledValues(now);
        rainFilterNode.frequency.setValueAtTime(rainFilterNode.frequency.value, now);
        rainFilterNode.frequency.linearRampToValueAtTime(1450, now + 2.0);
        rainFilterNode.frequency.linearRampToValueAtTime(1050, now + 4.5);

      } else if (type === 'bridge_hollow') {
        // Deep hollow viaduct resonance (5.5s)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(48, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(peakGain, now + 1.8);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 5.5);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(now);
        osc.stop(now + 5.6);
      }
    }


    // --- Living Rainforest Atmosphere (v3, procedural test-grade) ---
    // Soft insects, leaf rustle, sparse frog — all underneath, never loud.
    // atmosphereLevel scales them by phase: preflight 0.5, departure 0.8, drifts 1.0, lucid 0.4.
    function setAtmosphereLevel(level, token) {
      if (token !== sessionToken) return;
      atmosphereLevel = level;
      if (rainGainNode && audioCtx) {
        const now = audioCtx.currentTime;
        // Rain base 0.55, scaled 0.45 (preflight) to 0.62 (drifts) — keep it gentle
        const rainTarget = 0.45 + level * 0.30;
        rainGainNode.gain.cancelScheduledValues(now);
        rainGainNode.gain.setValueAtTime(rainGainNode.gain.value, now);
        rainGainNode.gain.linearRampToValueAtTime(rainTarget, now + 3);
      }
      if (insectMasterGain && audioCtx) {
        const now = audioCtx.currentTime;
        insectMasterGain.gain.cancelScheduledValues(now);
        insectMasterGain.gain.setValueAtTime(insectMasterGain.gain.value, now);
        insectMasterGain.gain.linearRampToValueAtTime(0.06 * level, now + 3);
      }
    }

    function scheduleInsectChirps(token) {
      if (!isPlaying || token !== sessionToken || !audioCtx) return;
      const nextMs = randomBetween(1200, 3600);
      insectTimeoutId = setTimeout(() => {
        if (!isPlaying || token !== sessionToken || !audioCtx || !insectMasterGain) { scheduleInsectChirps(token); return; }
        const now = audioCtx.currentTime;
        const pulses = randomBetween(5, 8);
        const baseFreq = 4200 + Math.random() * 900;
        const panVal = (Math.random() * 2 - 1) * 0.7;
        for (let i = 0; i < pulses; i++) {
          const t = now + i * 0.09;
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine';
          const pf = baseFreq * (1 + (Math.random() - 0.5) * 0.08);
          osc.frequency.setValueAtTime(pf, t);
          osc.frequency.linearRampToValueAtTime(pf * 0.88, t + 0.05);
          g.gain.setValueAtTime(0.001, t);
          g.gain.linearRampToValueAtTime(0.026 * atmosphereLevel, t + 0.015);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
          osc.connect(g);
          try {
            const pan = audioCtx.createStereoPanner();
            pan.pan.value = panVal;
            g.connect(pan); pan.connect(insectMasterGain);
          } catch (e) { g.connect(insectMasterGain); }
          osc.start(t); osc.stop(t + 0.07);
        }
        scheduleInsectChirps(token);
      }, nextMs);
    }

    function scheduleLeafRustle(token) {
      if (!isPlaying || token !== sessionToken || !audioCtx) return;
      const nextMs = randomBetween(9000, 18000);
      leafTimeoutId = setTimeout(() => {
        if (!isPlaying || token !== sessionToken || !audioCtx || !sharedNoiseBuffer || !insectMasterGain) { scheduleLeafRustle(token); return; }
        const now = audioCtx.currentTime;
        const src = audioCtx.createBufferSource();
        src.buffer = sharedNoiseBuffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(450 + Math.random() * 300, now);
        filter.frequency.linearRampToValueAtTime(850, now + 1.2);
        filter.frequency.linearRampToValueAtTime(500, now + 2.5);
        filter.Q.value = 1.2;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.03 * atmosphereLevel, now + 0.9);
        g.gain.exponentialRampToValueAtTime(0.001, now + 2.6);
        src.connect(filter); filter.connect(g); g.connect(insectMasterGain);
        src.start(now); src.stop(now + 2.7);
        scheduleLeafRustle(token);
      }, nextMs);
    }

    function scheduleFrog(token) {
      if (!isPlaying || token !== sessionToken || !audioCtx) return;
      const nextMs = randomBetween(20000, 40000);
      frogTimeoutId = setTimeout(() => {
        if (!isPlaying || token !== sessionToken || !audioCtx || !insectMasterGain) { scheduleFrog(token); return; }
        const now = audioCtx.currentTime;
        [0, 0.35].forEach((off) => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(170 + Math.random() * 30, now + off);
          g.gain.setValueAtTime(0.001, now + off);
          g.gain.linearRampToValueAtTime(0.016 * atmosphereLevel, now + off + 0.05);
          g.gain.exponentialRampToValueAtTime(0.001, now + off + 0.28);
          osc.connect(g); g.connect(insectMasterGain);
          osc.start(now + off); osc.stop(now + off + 0.3);
        });
        scheduleFrog(token);
      }, nextMs);
    }


    // --- Moon Bus Atmosphere (v4, soft cabin only — never wake them) ---
    function scheduleMoonPing(token) {
      if (!isPlaying || token !== sessionToken || !audioCtx || !masterGain || !moonPingEnabled) return;
      const nextMs = randomBetween(30000, 60000);
      moonPingTimeoutId = setTimeout(() => {
        if (!isPlaying || token !== sessionToken || !audioCtx || !masterGain || !moonPingEnabled) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(700 + Math.random() * 80, now); // <800 Hz per fresh-window audit
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.010, now + 0.3);
        g.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
        osc.connect(g); g.connect(masterGain);
        osc.start(now); osc.stop(now + 2.1);
        scheduleMoonPing(token);
      }, nextMs);
    }

    // 1. Lunar Bus Soundscape
    function startLunarBusSoundscape() {
      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 4);
      masterGain.connect(audioCtx.destination);

      const subOsc = audioCtx.createOscillator();
      subOsc.type = 'sine';
      subOsc.frequency.value = 55;
      subOsc.connect(masterGain);
      subOsc.start();

      const merger = audioCtx.createChannelMerger(2);
      const leftOsc = audioCtx.createOscillator();
      const rightOsc = audioCtx.createOscillator();
      const binauralGain = audioCtx.createGain();
      binauralGain.gain.value = 0.08;

      leftOsc.frequency.value = 110;
      rightOsc.frequency.value = 114;
      leftOsc.connect(merger, 0, 0);
      rightOsc.connect(merger, 0, 1);
      merger.connect(binauralGain);
      binauralGain.connect(masterGain);

      leftOsc.start();
      rightOsc.start();

      // Soft cabin air hiss (masking, like rain for space, very low)
      const airSrc = audioCtx.createBufferSource();
      airSrc.buffer = createPinkNoiseBuffer(18);
      const airFilter = audioCtx.createBiquadFilter();
      airFilter.type = 'lowpass'; airFilter.frequency.value = 600;
      moonAirGainNode = audioCtx.createGain(); moonAirGainNode.gain.value = 0.04;
      airSrc.connect(airFilter); airFilter.connect(moonAirGainNode); moonAirGainNode.connect(masterGain);
      airSrc.start();
      // Note: createPinkNoiseBuffer needs audioCtx, which is set here; ping scheduler uses token from caller — started in togglePortal via runMoonBusSequence? Instead start here with current sessionToken
      scheduleMoonPing(sessionToken);
    }

    // 2. Rainforest Sleeper Train Soundscape (18s organic rain + LFO + varied rail clack)
    function startRainforestSoundscape(token) {
      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0.28, audioCtx.currentTime + 4);
      masterGain.connect(audioCtx.destination);

      // A. Warm Wooden Cabin Resonance (62Hz) + 4Hz Theta Binaural Drift
      const cabinOsc = audioCtx.createOscillator();
      cabinOsc.type = 'sine';
      cabinOsc.frequency.value = 62;
      const cabinGain = audioCtx.createGain();
      cabinGain.gain.value = 0.42;
      cabinOsc.connect(cabinGain);
      cabinGain.connect(masterGain);
      cabinOsc.start();

      const merger = audioCtx.createChannelMerger(2);
      const leftOsc = audioCtx.createOscillator();
      const rightOsc = audioCtx.createOscillator();
      const binauralGain = audioCtx.createGain();
      binauralGain.gain.value = 0.05;
      leftOsc.frequency.value = 108;
      rightOsc.frequency.value = 112;
      leftOsc.connect(merger, 0, 0);
      rightOsc.connect(merger, 0, 1);
      merger.connect(binauralGain);
      binauralGain.connect(masterGain);
      leftOsc.start();
      rightOsc.start();

      // B. 18-Second Non-Repetitive Pink Noise Rain + Slow Breathing LFO
      sharedNoiseBuffer = createPinkNoiseBuffer(18);
      const rainSource = audioCtx.createBufferSource();
      rainSource.buffer = sharedNoiseBuffer;
      rainSource.loop = true;

      rainFilterNode = audioCtx.createBiquadFilter();
      rainFilterNode.type = 'lowpass';
      rainFilterNode.frequency.value = 1250;

      // 0.07Hz LFO (~14s cycle) gently shifts rain warmth so it never sounds static
      const rainLfo = audioCtx.createOscillator();
      const rainLfoGain = audioCtx.createGain();
      rainLfo.type = 'sine';
      rainLfo.frequency.value = 0.07;
      rainLfoGain.gain.value = 120;
      rainLfo.connect(rainLfoGain);
      rainLfoGain.connect(rainFilterNode.frequency);
      rainLfo.start();

      const rainGain = audioCtx.createGain();
      rainGain.gain.value = 0.55;
      rainGainNode = rainGain;
      insectMasterGain = audioCtx.createGain();
      insectMasterGain.gain.value = 0.03;
      insectMasterGain.connect(masterGain);
      rainSource.connect(rainFilterNode);
      rainFilterNode.connect(rainGain);
      rainGain.connect(masterGain);
      rainSource.start();

      // C. Organic, Varied Rail Clack-Clack (Drifts between 2.15s and 2.85s with subtle pitch/gain variation)
      function scheduleNextRailClack() {
        if (!isPlaying || token !== sessionToken || !audioCtx) return;
        const nextDelayMs = randomBetween(2150, 2850);
        clackTimeoutId = setTimeout(() => {
          if (!isPlaying || token !== sessionToken || !audioCtx) return;
          const now = audioCtx.currentTime;
          const baseFreq = randomBetween(73, 82);
          const pairGap = 0.20 + Math.random() * 0.05;
          const clackStrength = (0.10 + Math.random() * 0.04) * (0.4 + atmosphereLevel * 0.6);

          [0, pairGap].forEach((offset, idx) => {
            const osc = audioCtx.createOscillator();
            const clickGain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(baseFreq - idx * 4, now + offset);
            osc.frequency.exponentialRampToValueAtTime(36, now + offset + 0.075);

            clickGain.gain.setValueAtTime(0.001, now + offset);
            clickGain.gain.linearRampToValueAtTime(clackStrength, now + offset + 0.012);
            clickGain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.095);

            osc.connect(clickGain);
            clickGain.connect(masterGain);
            osc.start(now + offset);
            osc.stop(now + offset + 0.11);
          });

          scheduleNextRailClack();
        }, nextDelayMs);
      }
      scheduleNextRailClack();
      setAtmosphereLevel(0.5, token);
      scheduleInsectChirps(token);
      scheduleLeafRustle(token);
      scheduleFrog(token);
    }

    // --- Sailboat on a Quiet Bay Soundscape (Portal 3, drafted from its scripts) ---
    // Layers, all soft, steady, and getting quieter by phase — don't-wake rule:
    // 1. water lap (low-passed pink noise, 320 Hz) — the bay against the cedar hull
    // 2. night wind (bandpass noise, slow 220-380 Hz sweep) — breeze over the cove
    // 3. wooden cabin resonance (58 Hz) — the hull itself, like Rainforest's 62 Hz cabin
    // 4. sparse hull creak (every 9-14s, low triangle, never a clank, snap, or bell)
    // No halyard clanking, canvas snapping, buoy bells, gulls, or motor sounds.
    // Phase levels mirror Rainforest: preflight 0.5, departure 0.8, drifts 1.0, lucid 0.4.
    function setSailboatAtmosphereLevel(level, token) {
      if (token !== sessionToken) return;
      atmosphereLevel = level;
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      if (sailboatWaterGainNode) {
        sailboatWaterGainNode.gain.cancelScheduledValues(now);
        sailboatWaterGainNode.gain.setValueAtTime(sailboatWaterGainNode.gain.value, now);
        sailboatWaterGainNode.gain.linearRampToValueAtTime(0.35 + level * 0.30, now + 3);
      }
      if (sailboatWindGainNode) {
        sailboatWindGainNode.gain.cancelScheduledValues(now);
        sailboatWindGainNode.gain.setValueAtTime(sailboatWindGainNode.gain.value, now);
        sailboatWindGainNode.gain.linearRampToValueAtTime(0.04 + level * 0.04, now + 3);
      }
      if (sailboatCabinGainNode) {
        sailboatCabinGainNode.gain.cancelScheduledValues(now);
        sailboatCabinGainNode.gain.setValueAtTime(sailboatCabinGainNode.gain.value, now);
        sailboatCabinGainNode.gain.linearRampToValueAtTime(0.20 + level * 0.15, now + 3);
      }
    }

    function scheduleSailboatCreak(token) {
      if (!isPlaying || token !== sessionToken || !audioCtx) return;
      const nextMs = randomBetween(9000, 14000);
      sailboatCreakTimeoutId = setTimeout(() => {
        if (!isPlaying || token !== sessionToken || !audioCtx || !masterGain) { scheduleSailboatCreak(token); return; }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(105, now);
        osc.frequency.linearRampToValueAtTime(82, now + 1.0);
        osc.frequency.linearRampToValueAtTime(96, now + 2.0);
        filter.type = 'lowpass';
        filter.frequency.value = 220;
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.05 * atmosphereLevel, now + 0.7);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.1);
        osc.connect(filter); filter.connect(gain); gain.connect(masterGain);
        osc.start(now); osc.stop(now + 2.2);
        scheduleSailboatCreak(token);
      }, nextMs);
    }

    function startSailboatSoundscape(token) {
      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0.28, audioCtx.currentTime + 4);
      masterGain.connect(audioCtx.destination);

      // Wooden cabin / hull resonance (58 Hz)
      const cabinOsc = audioCtx.createOscillator();
      cabinOsc.type = 'sine';
      cabinOsc.frequency.value = 58;
      sailboatCabinGainNode = audioCtx.createGain();
      sailboatCabinGainNode.gain.value = 0.27;
      cabinOsc.connect(sailboatCabinGainNode);
      sailboatCabinGainNode.connect(masterGain);
      cabinOsc.start();

      sharedNoiseBuffer = createPinkNoiseBuffer(18);

      // Water lap: looped pink noise, low-passed at 320 Hz, slow tidal swell via LFO
      const waterSource = audioCtx.createBufferSource();
      waterSource.buffer = sharedNoiseBuffer;
      waterSource.loop = true;
      const waterFilter = audioCtx.createBiquadFilter();
      waterFilter.type = 'lowpass';
      waterFilter.frequency.value = 320;
      sailboatWaterGainNode = audioCtx.createGain();
      sailboatWaterGainNode.gain.value = 0.50;
      const waterLfo = audioCtx.createOscillator();
      const waterLfoGain = audioCtx.createGain();
      waterLfo.type = 'sine';
      waterLfo.frequency.value = 0.08;
      waterLfoGain.gain.value = 0.06;
      waterLfo.connect(waterLfoGain);
      waterLfoGain.connect(sailboatWaterGainNode.gain);
      waterLfo.start();
      waterSource.connect(waterFilter);
      waterFilter.connect(sailboatWaterGainNode);
      sailboatWaterGainNode.connect(masterGain);
      waterSource.start();

      // Night wind: second looped noise source, bandpass sweeping slowly 220-380 Hz
      const windSource = audioCtx.createBufferSource();
      windSource.buffer = sharedNoiseBuffer;
      windSource.loop = true;
      windSource.playbackRate.value = 0.7;
      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = 'bandpass';
      windFilter.frequency.value = 300;
      windFilter.Q.value = 1.0;
      const windLfo = audioCtx.createOscillator();
      const windLfoGain = audioCtx.createGain();
      windLfo.type = 'sine';
      windLfo.frequency.value = 0.05;
      windLfoGain.gain.value = 80;
      windLfo.connect(windLfoGain);
      windLfoGain.connect(windFilter.frequency);
      windLfo.start();
      sailboatWindGainNode = audioCtx.createGain();
      sailboatWindGainNode.gain.value = 0.06;
      windSource.connect(windFilter);
      windFilter.connect(sailboatWindGainNode);
      sailboatWindGainNode.connect(masterGain);
      windSource.start();

      setSailboatAtmosphereLevel(0.5, token);
      scheduleSailboatCreak(token);
    }

    async function runSailboatSequence(token) {
      const readout = document.getElementById('stage-readout');
      if (!(await waitSeconds(3, token))) return;
      await runPreflights(readout, token);
      if (!isPlaying || token !== sessionToken) return;

      // Phase 1: Pick 1 of 3 Rotating Departures (with real fallback to departure_1)
      const depChoice = randomBetween(1, 3);
      const depKey = `departure_${depChoice}`;
      setSailboatAtmosphereLevel(0.8, token);
      readout.textContent = `Phase 1: Boarding the Sailboat (Variant ${depChoice})...`;
      const playedDep = await playVoicePath(`audio/sailboat/${depKey}.wav`, 0.85, token);
      if (!playedDep && depChoice !== 1 && isPlaying && token === sessionToken) {
        await playVoicePath('audio/sailboat/departure_1.wav', 0.85, token);
      }

      // Phase 2: Shuffle 30 Micro-Drifts and deal 18 with progressive random silence gaps
      // Same dealing/gaps as Rainforest. No SFX cue map exists for Sailboat yet,
      // so no clipKey is passed — Rainforest cues must never fire on Sailboat clips.
      const allDrifts = Array.from({ length: 30 }, (_, i) => `drift_${String(i + 1).padStart(2, '0')}`);
      const tonightDrifts = shuffle(allDrifts).slice(0, 18);

      for (let i = 0; i < tonightDrifts.length; i++) {
        if (!isPlaying || token !== sessionToken) return;
        const gap = i < 8 ? randomBetween(10, 17) : randomBetween(17, 28);
        readout.textContent = `Phase 2: Sailboat Drift (${i + 1}/${tonightDrifts.length}) — Water & Wind`;
        if (!(await waitSeconds(gap, token))) return;
        if (i === 0) setSailboatAtmosphereLevel(1.0, token);
        readout.textContent = `Phase 2: Sailboat Drift (${i + 1}/${tonightDrifts.length})`;
        await playVoicePath(`audio/sailboat/${tonightDrifts[i]}.wav`, 0.76, token);
      }

      // Phase 3: Pick 1 of 3 Rotating Lucid Seeds, at softer volume
      if (!isPlaying || token !== sessionToken) return;
      setSailboatAtmosphereLevel(0.4, token);
      readout.textContent = "Phase 3: Deepening Hypnagogia...";
      if (!(await waitSeconds(randomBetween(22, 28), token))) return;
      const seedChoice = randomBetween(1, 3);
      readout.textContent = "Phase 3: Planting Lucid Seed...";
      await playVoicePath(`audio/sailboat/lucid_seed_${seedChoice}.wav`, 0.55, token);

      fadeOutSoundscape(readout, token);
    }

    // Plays a WAV clip with gentle 180ms fade-in/out envelope and optional described-action SFX cues
    async function playVoicePath(filePath, volume = 0.85, token = sessionToken, clipKey = null) {
      if (!isPlaying || token !== sessionToken) return false;
      try {
        const response = await fetch(filePath);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const arrayBuffer = await response.arrayBuffer();
        if (!isPlaying || token !== sessionToken || !audioCtx) return false;
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        return new Promise((resolve) => {
          if (!isPlaying || token !== sessionToken || !audioCtx) return resolve(false);

          const source = audioCtx.createBufferSource();
          source.buffer = audioBuffer;

          const lowpass = audioCtx.createBiquadFilter();
          lowpass.type = 'lowpass';
          lowpass.frequency.value = 2800;

          // Smooth 180ms fade-in and fade-out envelope on the voice
          const voiceGain = audioCtx.createGain();
          const now = audioCtx.currentTime;
          const dur = audioBuffer.duration;
          const fadeSec = Math.min(0.18, dur * 0.2);

          voiceGain.gain.setValueAtTime(0.001, now);
          voiceGain.gain.linearRampToValueAtTime(volume, now + fadeSec);
          if (dur > fadeSec * 2) {
            voiceGain.gain.setValueAtTime(volume, now + dur - fadeSec);
            voiceGain.gain.linearRampToValueAtTime(0.001, now + dur);
          }

          source.connect(lowpass);
          lowpass.connect(voiceGain);
          voiceGain.connect(audioCtx.destination);

          // Schedule any subtle described-action sound cues for this clip
          if (clipKey && RAINFOREST_SFX_CUES[clipKey]) {
            RAINFOREST_SFX_CUES[clipKey].forEach((cue) => {
              const tid = setTimeout(() => {
                triggerSubtleCue(cue.type, cue.gain, token);
              }, cue.delay * 1000);
              sfxTimeouts.push(tid);
            });
          }

          currentVoiceSource = source;
          source.onended = () => resolve(true);
          source.start();
        });
      } catch (e) {
        console.warn(`Skipped missing clip: ${filePath}`);
        return false;
      }
    }

    function waitSeconds(sec, token) {
      return new Promise((resolve) => {
        timerId = setTimeout(() => {
          resolve(isPlaying && token === sessionToken);
        }, sec * 1000);
      });
    }

    async function runPreflights(readout, token) {
      const unwindActive = document.getElementById('pill-unwind').classList.contains('active');
      const shuffleActive = document.getElementById('pill-shuffle').classList.contains('active');

      if (unwindActive && isPlaying && token === sessionToken) {
        for (let i = 1; i <= 10; i++) {
          if (!isPlaying || token !== sessionToken) return;
          const stepNum = String(i).padStart(2, '0');
          readout.textContent = `Pre-Flight: Body Unwind (${i}/10)`;
          await playVoicePath(`audio/preflight/body_unwind/step_${stepNum}.wav`, 0.82, token);
          if (!isPlaying || token !== sessionToken) return;
          await waitSeconds(randomBetween(7, 10), token);
        }
      }

      if (shuffleActive && isPlaying && token === sessionToken) {
        const pool = Array.from({ length: 40 }, (_, i) => String(i + 1).padStart(2, '0'));
        const tonightObjects = shuffle(pool).slice(0, 25);
        for (let i = 0; i < tonightObjects.length; i++) {
          if (!isPlaying || token !== sessionToken) return;
          readout.textContent = `Pre-Flight: Mind Shuffle (${i + 1}/25)`;
          await playVoicePath(`audio/preflight/mind_shuffle/obj_${tonightObjects[i]}.wav`, 0.78, token);
          if (!isPlaying || token !== sessionToken) return;
          await waitSeconds(randomBetween(6, 10), token);
        }
      }
    }

    async function runMoonBusSequence(token) {
      const readout = document.getElementById('stage-readout');
      if (!(await waitSeconds(3, token))) return;
      await runPreflights(readout, token);
      if (!isPlaying || token !== sessionToken) return;

      if (masterGain && audioCtx) { masterGain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 3); }
      readout.textContent = "Phase 1: Boarding & Grounding...";
      await playVoicePath('audio/moon_bus/departure.wav', 0.85, token);

      const driftClips = shuffle(['drift_1', 'drift_2', 'drift_3', 'drift_4', 'drift_5', 'drift_6']);
      for (let i = 0; i < driftClips.length; i++) {
        if (!isPlaying || token !== sessionToken) return;
        if (i === 3) { moonPingEnabled = false; clearTimeout(moonPingTimeoutId); }
        readout.textContent = `Phase 2: Lunar Drift (${i + 1}/${driftClips.length}) — Ambient Pause`;
        if (!(await waitSeconds(randomBetween(12, 19), token))) return;
        readout.textContent = `Phase 2: Lunar Drift (${i + 1}/${driftClips.length})`;
        await playVoicePath(`audio/moon_bus/${driftClips[i]}.wav`, 0.78, token);
      }

      if (!isPlaying || token !== sessionToken) return;
      if (masterGain && audioCtx) { masterGain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 3); }
      readout.textContent = "Phase 3: Deepening Hypnagogia...";
      if (!(await waitSeconds(randomBetween(20, 26), token))) return;
      readout.textContent = "Phase 3: Planting Lucid Seed...";
      await playVoicePath('audio/moon_bus/lucid_seed.wav', 0.55, token);

      fadeOutSoundscape(readout, token);
    }

    async function runRainforestSequence(token) {
      const readout = document.getElementById('stage-readout');
      if (!(await waitSeconds(3, token))) return;
      await runPreflights(readout, token);
      if (!isPlaying || token !== sessionToken) return;

      // Phase 1: Pick 1 of 3 Rotating Departures (with real fallback to departure_1)
      const depChoice = randomBetween(1, 3);
      const depKey = `departure_${depChoice}`;
      setAtmosphereLevel(0.8, token);
      readout.textContent = `Phase 1: Boarding Sleeper Car (Variant ${depChoice})...`;
      const playedDep = await playVoicePath(`audio/rainforest/${depKey}.wav`, 0.85, token, depKey);
      if (!playedDep && depChoice !== 1 && isPlaying && token === sessionToken) {
        await playVoicePath('audio/rainforest/departure_1.wav', 0.85, token, 'departure_1');
      }

      // Phase 2: Shuffle 30 Micro-Drifts and deal 18 with progressive random silence gaps
      const allDrifts = Array.from({ length: 30 }, (_, i) => `drift_${String(i + 1).padStart(2, '0')}`);
      const tonightDrifts = shuffle(allDrifts).slice(0, 18);

      for (let i = 0; i < tonightDrifts.length; i++) {
        if (!isPlaying || token !== sessionToken) return;
        const gap = i < 8 ? randomBetween(10, 17) : randomBetween(17, 28);
        readout.textContent = `Phase 2: Rainforest Drift (${i + 1}/${tonightDrifts.length}) — Rain & Rails`;
        if (!(await waitSeconds(gap, token))) return;
        if (i === 0) setAtmosphereLevel(1.0, token);
        const clipKey = tonightDrifts[i];
        readout.textContent = `Phase 2: Rainforest Drift (${i + 1}/${tonightDrifts.length})`;
        await playVoicePath(`audio/rainforest/${clipKey}.wav`, 0.76, token, clipKey);
      }

      // Phase 3: Pick 1 of 3 Rotating Lucid Seeds
      if (!isPlaying || token !== sessionToken) return;
      setAtmosphereLevel(0.4, token);
      readout.textContent = "Phase 3: Deepening Hypnagogia...";
      if (!(await waitSeconds(randomBetween(22, 28), token))) return;
      const seedChoice = randomBetween(1, 3);
      readout.textContent = "Phase 3: Planting Lucid Seed...";
      await playVoicePath(`audio/rainforest/lucid_seed_${seedChoice}.wav`, 0.55, token);

      fadeOutSoundscape(readout, token);
    }

    function fadeOutSoundscape(readout, token) {
      if (!isPlaying || token !== sessionToken || !audioCtx || !masterGain) return;
      readout.textContent = "Phase 4: 8-Minute Soundscape Fade to Silence";
      const fadeSeconds = 480;
      masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + fadeSeconds);
      timerId = setTimeout(() => {
        if (isPlaying && token === sessionToken) stopSession("Session complete — Goodnight");
      }, fadeSeconds * 1000);
    }

    function stopSession(message = "Session paused") {
      isPlaying = false;
      activePortal = null;
      sessionToken++;
      document.getElementById('moon-bus-card').classList.remove('playing');
      document.getElementById('rainforest-card').classList.remove('playing');
      document.getElementById('sailboat-card').classList.remove('playing');
      document.getElementById('stage-readout').textContent = message;
      if (currentVoiceSource) {
        try { currentVoiceSource.stop(); } catch (e) {}
        currentVoiceSource = null;
      }
      clearTimeout(timerId);
      clearTimeout(clackTimeoutId);
      clearTimeout(moonPingTimeoutId); moonPingEnabled = true;
      moonAirGainNode = null;
      clearTimeout(insectTimeoutId);
      clearTimeout(leafTimeoutId);
      clearTimeout(frogTimeoutId);
      clearTimeout(sailboatCreakTimeoutId);
      sailboatWaterGainNode = null; sailboatWindGainNode = null; sailboatCabinGainNode = null;
      rainGainNode = null; insectMasterGain = null; atmosphereLevel = 1.0;
      sfxTimeouts.forEach(clearTimeout);
      sfxTimeouts = [];
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
    }

    function togglePortal(portalKey) {
      if (isPlaying) {
        const wasSame = activePortal === portalKey;
        stopSession();
        if (wasSame) return;
      }

      isPlaying = true;
      activePortal = portalKey;
      const currentToken = ++sessionToken;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      if (portalKey === 'moon_bus') {
        document.getElementById('moon-bus-card').classList.add('playing');
        startLunarBusSoundscape();
        runMoonBusSequence(currentToken);
      } else if (portalKey === 'rainforest') {
        document.getElementById('rainforest-card').classList.add('playing');
        startRainforestSoundscape(currentToken);
        runRainforestSequence(currentToken);
      } else if (portalKey === 'sailboat') {
        document.getElementById('sailboat-card').classList.add('playing');
        startSailboatSoundscape(currentToken);
        runSailboatSequence(currentToken);
      }
    }
  </script>
